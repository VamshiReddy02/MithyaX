<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MithyaX Setup</title>
    <style>
      body {
        font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 420px;
        margin: 32px auto;
        color: #1a1a1a;
      }
      h1 {
        font-size: 18px;
        margin-bottom: 4px;
      }
      p.sub {
        color: #555;
        margin-top: 0;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 16px 0 4px;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        font: inherit;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      .hint {
        color: #777;
        font-size: 12px;
        margin-top: 4px;
      }
      .actions {
        margin-top: 20px;
        display: flex;
        gap: 8px;
      }
      button {
        font: inherit;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #f3f3f3;
        cursor: pointer;
      }
      button.primary {
        background: #1a1a1a;
        color: #fff;
        border-color: #1a1a1a;
      }
      #status {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 6px;
        display: none;
      }
      #status.ok {
        display: block;
        background: #e6f4ea;
        color: #1e4620;
      }
      #status.error {
        display: block;
        background: #fdecea;
        color: #611a15;
      }
    </style>
  </head>
  <body>
    <h1>MithyaX Setup</h1>
    <p class="sub">Connect this extension to your MithyaX gateway.</p>

    <label for="gatewayUrl">Gateway URL</label>
    <input id="gatewayUrl" type="text" placeholder="https://your-mithyax-gateway.example.com" />
    <div class="hint">The address the pilot organizer gave you — no trailing slash.</div>

    <label for="extensionToken">Extension Token</label>
    <input id="extensionToken" type="password" placeholder="Paste the token you were given" />
    <div class="hint">Also provided by the pilot organizer. Only used to authenticate this extension — never shared with anyone else.</div>

    <div class="actions">
      <button id="test">Test connection</button>
      <button id="save" class="primary">Save</button>
    </div>

    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
