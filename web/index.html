<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MithyaX Video Call</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 24px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
  }
  #controls {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  input, select {
    background: #1c1c1c;
    color: #eee;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 6px 8px;
  }
  button {
    background: #2d6cdf;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:disabled {
    background: #444;
    cursor: not-allowed;
  }
  button.hangup {
    background: #c0392b;
  }
  #videos {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .video-box {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  video {
    width: 360px;
    height: 270px;
    background: #000;
    border-radius: 6px;
  }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    width: fit-content;
  }
  .badge-pending {
    background: #2a2a2a;
    color: #999;
  }
  .badge-real {
    background: #14331a;
    color: #4caf50;
  }
  .badge-fake {
    background: #3a1414;
    color: #e05353;
  }
  #status {
    margin-top: 16px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    color: #9a9;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
  <h1>MithyaX Video Call</h1>

  <div id="controls">
    <input id="gatewayUrl" size="30" value="ws://localhost:8080/api/v1/ws" />
    <input id="room" size="16" placeholder="room id" />
    <select id="cameraSelect"><option value="">Default camera</option></select>
    <button id="joinButton">Join Call</button>
    <button id="hangupButton" class="hangup" disabled>Hang Up</button>
  </div>

  <div id="videos">
    <div class="video-box">
      <span>You</span>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <!-- One tile per other participant is added here dynamically as they join. -->
  </div>

  <pre id="status"></pre>

  <script src="call.js"></script>
</body>
</html>
