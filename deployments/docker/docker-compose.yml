services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  video-detector:
    build:
      context: ../../services/video-detector
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  gateway:
    build:
      context: ../../services/gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_DETECTOR_URL: http://video-detector:8000
      # CPU-only inference inside the container (no MPS/GPU passthrough)
      # is much slower than a host run, so this needs real headroom.
      GATEWAY_DETECTOR_TIMEOUT: 300s
      GATEWAY_REDIS_ADDR: redis:6379
    depends_on:
      video-detector:
        condition: service_healthy
      redis:
        condition: service_healthy
