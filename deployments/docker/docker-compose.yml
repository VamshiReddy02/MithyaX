services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Sourced from .env (see .env.example) — no fallback values here on
      # purpose, so no credential of any kind, dev or otherwise, sits in
      # a committed file. Copy .env.example to .env and fill it in before
      # running this.
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deployments/docker/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deployments/docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deployments/docker/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  video-detector:
    build:
      context: ../../services/video-detector
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  gateway:
    build:
      context: ../../services/gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Defaults to "development" (see internal/config.defaultEnvironment)
      # if unset, which never engages gin's release mode — this is the
      # one thing that made this a "production" deployment in name only.
      GATEWAY_ENV: production
      GATEWAY_DETECTOR_URL: http://video-detector:8000
      # CPU-only inference inside the container (no MPS/GPU passthrough)
      # is much slower than a host run, so this needs real headroom.
      GATEWAY_DETECTOR_TIMEOUT: 300s
      GATEWAY_REDIS_URL: redis://redis:6379
      GATEWAY_DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER in deployments/docker/.env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deployments/docker/.env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in deployments/docker/.env}
      GATEWAY_AUTH_TOKEN: ${GATEWAY_AUTH_TOKEN:?set GATEWAY_AUTH_TOKEN in deployments/docker/.env}
      GATEWAY_ADMIN_AUTH_TOKEN: ${GATEWAY_ADMIN_AUTH_TOKEN:?set GATEWAY_ADMIN_AUTH_TOKEN in deployments/docker/.env}
      GATEWAY_EXTENSION_TOKEN: ${GATEWAY_EXTENSION_TOKEN:?set GATEWAY_EXTENSION_TOKEN in deployments/docker/.env}
    depends_on:
      video-detector:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # /gateway ships in a distroless image with no shell/wget/curl to
      # exec a normal check with — see cmd/gateway/main.go's -healthcheck
      # flag, which hits GET /health over loopback and exits accordingly.
      test: ["CMD", "/gateway", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
